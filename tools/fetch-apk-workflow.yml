# ── 빌드 완료된 APK를 이 저장소 브랜치로 가져오는 워크플로우 ─────────────
# 배경: 에이전트 샌드박스에서 Actions 아티팩트 저장소(Azure Blob)로의
# 직접 다운로드가 차단되어 `gh run download` 가 실패한다.
# 대신 이 워크플로우가 러너 안에서 아티팩트를 받아 고정 파일명
# `synkey-nevi-debug.apk` 로 이 브랜치에 커밋/푸시하면,
# 에이전트는 git(github.com) 경유로 APK를 받아 사용자에게 제시할 수 있다.
#
# 재빌드 시 사용법 (기존 APK는 같은 파일명으로 자동 교체됨):
#   gh workflow run fetch-apk.yml --ref <브랜치>            # 최신 성공 빌드 자동 선택
#   gh workflow run fetch-apk.yml --ref <브랜치> -f run_id=<특정 run id>
# 워크플로우 완료 후: git pull 하면 교체된 synkey-nevi-debug.apk 를 받는다.

name: Fetch APK to branch

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'APK를 가져올 Build synkey_nevi run id (비우면 최신 성공 빌드)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Download APK artifact from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$INPUT_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "❌ 성공한 빌드 run을 찾지 못했습니다"; exit 1; }
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '"run: \(.id) conclusion=\(.conclusion) created_at=\(.created_at) url=\(.html_url)"'

          rm -rf /tmp/apkdl && mkdir -p /tmp/apkdl
          gh run download "$RUN_ID" -n synkey-nevi-debug-apk -D /tmp/apkdl
          APK_SRC=$(find /tmp/apkdl -name '*.apk' | head -n 1)
          [ -n "$APK_SRC" ] || { echo "❌ 아티팩트 안에 APK가 없습니다"; exit 1; }
          ls -lh "$APK_SRC"

          # 기존 APK 삭제 후 고정 파일명으로 교체 (재빌드 때마다 이 파일만 갱신됨)
          rm -f synkey-nevi-debug.apk
          cp "$APK_SRC" synkey-nevi-debug.apk
          ls -lh synkey-nevi-debug.apk

      - name: Write apk-info.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID")
          RUN_URL=$(printf '%s' "$RUN_JSON" | jq -r '.html_url')
          RUN_CREATED=$(printf '%s' "$RUN_JSON" | jq -r '.created_at')
          # logs/<slug>.json 중 이 run_id와 일치하는 파일에서 소스 브랜치/sha 조회
          SOURCE_BRANCH="unknown"; SOURCE_SHA="unknown"
          for f in logs/*.json; do
            [ -f "$f" ] || continue
            if [ "$(jq -r '.run_id // empty' "$f" 2>/dev/null)" = "$RUN_ID" ]; then
              SOURCE_BRANCH=$(jq -r '.source_branch // "unknown"' "$f")
              SOURCE_SHA=$(jq -r '.source_sha // "unknown"' "$f")
              break
            fi
          done
          SHA256=$(sha256sum synkey-nevi-debug.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s synkey-nevi-debug.apk)
          jq -n \
            --arg apk_file "synkey-nevi-debug.apk" \
            --argjson run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg run_created_at "$RUN_CREATED" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg sha256 "$SHA256" \
            --argjson size_bytes "$SIZE" \
            --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{apk_file:$apk_file, run_id:$run_id, run_url:$run_url, run_created_at:$run_created_at, source_branch:$source_branch, source_sha:$source_sha, sha256:$sha256, size_bytes:$size_bytes, fetched_at:$fetched_at}' \
            > apk-info.json
          cat apk-info.json

      - name: Commit and push APK (replace previous)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synkey-nevi-debug.apk apk-info.json
          if git diff --cached --quiet; then
            echo "변경 없음 (이미 같은 APK)"
            exit 0
          fi
          git commit -m "apk: 최신 빌드 APK 교체 (run $RUN_ID) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
