# ── 공개 저장소(synkeybuild)에 넣을 빌드 워크플로우 ──────────────────────
# 역할: synkey_nevi 의 다리 워크플로우가 보낸 build-request 신호를 받아
# 개인 저장소 synkey_nevi 를 토큰으로 체크아웃해 빌드한다.
# 공개 저장소의 Actions 는 무료 무제한이므로 분량 걱정이 없다.

# 2026-09-18 개선(공용 키스토어):
# - synkey_nevi 에 app/debug.keystore, app/release.keystore 가 커밋됨
# - build.gradle.kts 가 getByName("debug") 로 공용 키스토어를 사용하므로
#   모든 빌드가 동일한 서명으로 생성되어 adb install -r 업데이트 가능
# - 이 워크플로우에서 키스토어 존재 여부와 서명을 로그로 출력

name: Build synkey_nevi

on:
  # 에이전트가 요청 파일만 갱신하면 APK 전송 작업이 실행된다.
  push:
    branches: [arena/94294d67-synkeybuild]
    paths: [tools/apk-request.json]
  repository_dispatch:
    types: [build-request]
  workflow_dispatch:
    inputs:
      branch:
        description: '빌드할 synkey_nevi 브랜치'
        required: false
        default: 'main'

permissions:
  contents: write
  actions: write

jobs:
  build:
    # APK 전송용 push에서는 빌드하지 않고, 나머지는 기존대로 동작한다.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    env:
      SRC_BRANCH: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
    steps:
      - name: Checkout private synkey_nevi
        uses: actions/checkout@v4
        with:
          repository: montage8/synkey_nevi
          ref: ${{ github.event.client_payload.branch || inputs.branch || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Record source sha
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Verify shared keystore exists (공용 키스토어 확인)
        run: |
          echo "=== 공용 키스토어 확인 ==="
          ls -lh app/*.keystore || (echo "❌ app/*.keystore 없음! main에 공용 키스토어가 머지되었는지 확인" && exit 1)
          echo ""
          echo "debug.keystore SHA256: $(sha256sum app/debug.keystore | cut -d' ' -f1)"
          echo "release.keystore SHA256: $(sha256sum app/release.keystore | cut -d' ' -f1)"
          echo ""
          echo "키스토어 정보:"
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey 2>&1 | head -n 20 || true
          echo ""
          echo "✅ 공용 키스토어 확인 완료 - 이 키스토어로 빌드하면 모든 APK 서명이 동일하여 업데이트 가능"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify API key secrets (API 키 시크릿 확인)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          MISSING=""
          [ -n "$KAKAO_REST_API_KEY" ] || MISSING="$MISSING KAKAO_REST_API_KEY"
          [ -n "$VWORLD_API_KEY" ] || MISSING="$MISSING VWORLD_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ API 키 시크릿 부족:$MISSING"
            echo "   synkeybuild 저장소 > Settings > Secrets and variables > Actions > New repository secret 에 등록하세요."
            exit 1
          fi
          echo "✅ API 키 시크릿 검증 완료 (카카오 ${#KAKAO_REST_API_KEY}자, 비월드 ${#VWORLD_API_KEY}자)"
          # 카카오내비 SDK(KNSDK) 네이티브 앱 키는 '선택' 시크릿이다.
          # 없어도 빌드는 정상 진행되며, 앱 내 '설정 > 카카오 네이티브 키 설정'에서 입력하면 된다.
          if [ -n "$KAKAO_NATIVE_APP_KEY" ]; then
            echo "ℹ️ KAKAO_NATIVE_APP_KEY 시크릿 등록됨 (${#KAKAO_NATIVE_APP_KEY}자) - BuildConfig로 주입"
          else
            echo "ℹ️ KAKAO_NATIVE_APP_KEY 미등록 (선택 사항) - 앱 내 다이얼로그에서 키 입력 가능"
          fi

      - name: Build debug APK (공용 키스토어로 서명됨)
        id: build
        shell: bash
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          # 선택 시크릿: 미등록 시 빈 값이 주입되고, 앱은 앱 내 다이얼로그 입력 키를 사용한다.
          # (app/build.gradle.kts 의 fail-fast 대상이 아니므로 빌드가 실패하지 않는다)
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Print APK signature
        if: always()
        run: |
          echo "=== APK 서명 확인 ==="
          APK=$(find app/build/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            echo "APK: $APK"
            ls -lh "$APK"
            if [ -f "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
              $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true
            else
              APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
              if [ -n "$APKSIGNER" ]; then
                $APKSIGNER verify --print-certs "$APK" || true
              else
                echo "apksigner not found"
                unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>&1 | head -n 30 || echo "v2/v3 서명 - 정상"
              fi
            fi
            echo ""
            echo "✅ 이 APK는 app/debug.keystore 로 서명되었으므로 adb install -r 로 업데이트 가능"
          else
            echo "APK not found"
          fi

      - name: Publish build log to logs/
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          REPO: montage8/synkeybuild
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -u
          SOURCE_SHA="${SOURCE_SHA:-unknown}"
          LOG=/tmp/gradle-build.log
          if [ ! -f "$LOG" ]; then
            : > "$LOG"
          fi
          slug=$(printf '%s' "$SRC_BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          [ -n "$slug" ] || slug=build
          redact() {
            sed -E -e 's/(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{16,}/***REDACTED***/g' -e 's/github_pat_[A-Za-z0-9_]{16,}/***REDACTED***/g' -e 's/(Authorization: (Basic|Bearer) )[A-Za-z0-9._%+/-]+/\1***REDACTED***/g'
          }
          {
            grep -nE '^e: |error:|unresolved reference|type mismatch|FAILURE:|What went wrong|^> Task .* FAILED|Execution failed for task|Caused by:|GradleException' "$LOG" | tail -n 250 || true
            echo "----- What went wrong 본문 -----"
            awk '/What went wrong/{f=1} f{print} f&&++c>45{exit}' "$LOG" || true
            tail -n 60 "$LOG" || true
          } | redact | tail -c 400000 > /tmp/err.txt
          tail -n 2000 "$LOG" | redact | tail -c 600000 > /tmp/tail.log
          {
            printf '{\n  "source_branch": "%s",\n  "source_sha": "%s",\n  "build_outcome": "%s",\n  "run_id": %s,\n  "run_attempt": %s,\n  "run_url": "%s",\n  "generated_at": "%s"\n}\n' "$SRC_BRANCH" "$SOURCE_SHA" "$BUILD_OUTCOME" "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/status.json
          put_file() {
            local path="$1" file="$2" msg="$3" sha payload
            sha=$(curl -sS -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/contents/$path?ref=main" 2>/dev/null | jq -r 'if type=="object" then (.sha // empty) else empty end')
            if [ -n "$sha" ]; then
              payload=$(jq -n --arg m "$msg" --arg s "$sha" --rawfile c "$file" '{message:$m, sha:$s, content:($c|@base64), branch:"main"}')
            else
              payload=$(jq -n --arg m "$msg" --rawfile c "$file" '{message:$m, content:($c|@base64), branch:"main"}')
            fi
            curl -sS -o /tmp/put_resp.json -w "PUT $path -> HTTP %{http_code}\n" -X PUT -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/contents/$path" -d "$payload" || true
          }
          put_file "logs/$slug.json" /tmp/status.json "ci: 빌드 상태 마커 ($SRC_BRANCH $BUILD_OUTCOME) [skip ci]"
          put_file "logs/$slug.errors.txt" /tmp/err.txt "ci: 빌드 오류 발췌 ($SRC_BRANCH $BUILD_OUTCOME) [skip ci]"
          put_file "logs/$slug.tail.log" /tmp/tail.log "ci: 빌드 로그 뒷부분 ($SRC_BRANCH $BUILD_OUTCOME) [skip ci]"
          cp /tmp/gradle-build.log ./gradle-build.log 2>/dev/null || true
          cp /tmp/err.txt ./gradle-build-errors.txt 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: synkey-nevi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: synkey-nevi-build-log
          path: |
            gradle-build.log
            gradle-build-errors.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup old APK artifacts (keep newest 3)
        if: always()
        continue-on-error: true
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resp=$(curl -sS -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/montage8/synkeybuild/actions/artifacts?per_page=100")
          ids=$(printf '%s' "$resp" | jq -r 'if (.artifacts|type)=="array" then (.artifacts | sort_by(.created_at) | reverse | .[3:] | .[] | .id) else empty end')
          [ -z "$ids" ] && echo "삭제할 아티팩트 없음" && exit 0
          for id in $ids; do curl -sS -o /dev/null -w "delete[%{http_code}] id=$id\n" -X DELETE -H "Authorization: Bearer $GT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/montage8/synkeybuild/actions/artifacts/$id"; done

  export-apk:
    name: Export encrypted APK for workspace
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout APK request
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Export artifact as encrypted temporary chunks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          # 요청 파일에는 비밀값이 아닌 공개키와 대상 run ID만 있다.
          request_file=tools/apk-request.json
          [[ -f "$request_file" ]] || { echo 'APK 요청 파일이 없습니다.' >&2; exit 1; }
          run_id=$(jq -er '.run_id | tostring' "$request_file")
          public_key_b64=$(jq -er '.public_key' "$request_file")
          request_id=$(jq -er '.request_id' "$request_file")
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'run ID가 숫자가 아닙니다.' >&2; exit 1; }
          [[ "$public_key_b64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo '공개키 형식 오류' >&2; exit 1; }
          (( ${#public_key_b64} <= 2048 )) || { echo '공개키가 너무 깁니다.' >&2; exit 1; }
          [[ "$request_id" =~ ^[0-9a-f]{32}$ ]] || { echo '요청 ID 형식 오류' >&2; exit 1; }

          work_dir=$(mktemp -d "${RUNNER_TEMP}/synkey-apk.XXXXXX")
          trap 'rm -rf -- "$work_dir"' EXIT
          printf '%s' "$public_key_b64" | base64 -d > "$work_dir/public.der"
          openssl pkey -pubin -inform DER -in "$work_dir/public.der" -noout > /dev/null

          # 임의의 아티팩트가 아니라 성공한 기존 빌드의 APK인지 확인한다.
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          printf '%s' "$run_json" | jq -e \
            '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/build.yml"' \
            > /dev/null || { echo '성공한 빌드 run이 아닙니다.' >&2; exit 1; }
          run_url=$(printf '%s' "$run_json" | jq -er '.html_url')
          mkdir -p "$work_dir/artifact"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name synkey-nevi-debug-apk --dir "$work_dir/artifact"
          mapfile -d '' -t apk_files < <(find "$work_dir/artifact" -type f -iname '*.apk' -print0)
          (( ${#apk_files[@]} == 1 )) || { echo 'APK가 정확히 하나여야 합니다.' >&2; exit 1; }
          apk=${apk_files[0]}
          unzip -tq "$apk" > /dev/null
          unzip -Z -1 "$apk" > "$work_dir/apk-entries.txt"
          grep -Fx 'AndroidManifest.xml' "$work_dir/apk-entries.txt" > /dev/null
          apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f1)
          apk_size=$(stat -c '%s' "$apk")

          # 1회용 대칭키로 암호화하고, 이 키는 요청자의 공개키로만 암호화한다.
          # 개인키와 원본 APK는 GitHub 저장소에 올리지 않는다.
          openssl rand -hex 32 > "$work_dir/passphrase"
          openssl pkeyutl -encrypt -pubin -inkey "$work_dir/public.der" -keyform DER \
            -in "$work_dir/passphrase" -out "$work_dir/passphrase.enc" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 -md sha256 \
            -pass "file:$work_dir/passphrase" -in "$apk" -out "$work_dir/apk.enc"
          cipher_sha256=$(sha256sum "$work_dir/apk.enc" | cut -d ' ' -f1)
          cipher_size=$(stat -c '%s' "$work_dir/apk.enc")

          # GitHub API 요청 크기 제한을 피하도록 암호문을 8 MiB씩 전송한다.
          # Git에 파일/커밋을 만들지 않는 임시 Git 객체이며, GitHub의 보관 및
          # 가비지 컬렉션 시점은 보장할 수 없다.
          split -b 8M -d -a 4 "$work_dir/apk.enc" "$work_dir/part-"
          : > "$work_dir/chunks.jsonl"
          for part in "$work_dir"/part-*; do
            base64 -w 0 "$part" | jq -Rs '{content: ., encoding: "base64"}' > "$work_dir/request.json"
            blob_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
              --input "$work_dir/request.json" --jq '.sha')
            [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Git 객체 생성 실패' >&2; exit 1; }
            part_sha256=$(sha256sum "$part" | cut -d ' ' -f1)
            part_size=$(stat -c '%s' "$part")
            jq -nc --arg blob "$blob_sha" --arg sha256 "$part_sha256" --argjson size "$part_size" \
              '{blob: $blob, sha256: $sha256, size: $size}' >> "$work_dir/chunks.jsonl"
          done

          # 개인키가 없는 공개 매니페스트다. 에이전트가 Actions 검사 주석에서 읽는다.
          enc_passphrase=$(base64 -w 0 "$work_dir/passphrase.enc")
          jq -nc \
            --argjson version 1 --argjson run_id "$run_id" --arg run_url "$run_url" \
            --arg request_id "$request_id" --arg request_commit "$GITHUB_SHA" \
            --arg apk_sha256 "$apk_sha256" --argjson apk_size "$apk_size" \
            --arg cipher_sha256 "$cipher_sha256" --argjson cipher_size "$cipher_size" \
            --arg enc_passphrase "$enc_passphrase" --slurpfile chunks "$work_dir/chunks.jsonl" \
            '{version: $version, run_id: $run_id, run_url: $run_url,
              request_id: $request_id, request_commit: $request_commit,
              apk_sha256: $apk_sha256, apk_size: $apk_size,
              cipher_sha256: $cipher_sha256, cipher_size: $cipher_size,
              enc_passphrase: $enc_passphrase, chunks: $chunks}' > "$work_dir/manifest.json"
          printf '::notice title=SYNKEY_APK_MANIFEST::%s\n' "$(base64 -w 0 "$work_dir/manifest.json")"
          echo "암호화된 APK 전송 준비 완료: run $run_id"
