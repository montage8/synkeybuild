name: Build synkey_nevi

on:
  repository_dispatch:
    types: [build-request]
  workflow_dispatch:
    inputs:
      branch:
        description: '빌드할 synkey_nevi 브랜치'
        required: false
        default: 'arena/01a03d03-synkey-nevi'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private synkey_nevi
        uses: actions/checkout@v4
        with:
          repository: montage8/synkey_nevi
          ref: ${{ github.event.client_payload.branch || inputs.branch || 'arena/01a03d03-synkey-nevi' }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: synkey-nevi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
