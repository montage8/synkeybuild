name: Build signed Play AAB
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch in private synkey_nevi repository
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: montage8/synkey_nevi
          ref: ${{ inputs.branch }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed bundle
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: synkey-upload
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PLAY_KEYSTORE_BASE64" && test -n "$PLAY_UPLOAD_STORE_PASSWORD" && test -n "$PLAY_UPLOAD_KEY_PASSWORD"
          export PLAY_UPLOAD_KEYSTORE="$RUNNER_TEMP/synkey-upload.p12"
          trap 'rm -f "$PLAY_UPLOAD_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$PLAY_UPLOAD_KEYSTORE"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          jarsigner -verify app/build/outputs/bundle/release/*.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: synkey-play-signed-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
